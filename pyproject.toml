[project]
name = "personalcrm"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=1.2.0",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "celery-types>=0.26.0",
    "fastapi[standard]>=0.140.0",
    "google>=3.0.0",
    "google-genai>=2.20.0",
    "openai>=3.5.0",
    "phonenumbers>=9.0.38",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "python-ulid>=4.0.1",
    "redis>=8.1.0",
    "sqlmodel>=0.0.39",
    "tenacity>=9.1.4",
    "uvicorn>=0.51.0",
    "weasyprint>=69.0",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
personalcrm = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "personalcrm",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disallow_incomplete_defs = true
warn_unused_configs = true
exclude = ["backend/migration/"]

[tool.fastapi]
entrypoint = "backend.app.main:app"

