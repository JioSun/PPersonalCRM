name: personalcrm-tests
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crm_test
      POSTGRES_PASSWORD: crm_test_only
      POSTGRES_DB: personalcrm_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_test -d personalcrm_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
