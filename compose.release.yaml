services:
  backend:
    image: "personalcrm:${APP_VERSION:?APP_VERSION_required}"
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: postgres
      REDIS_HOST: redis
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips=*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}"
      POSTGRES_DB: personalcrm
      LC_MESSAGES: en_US.UTF-8
    volumes:
      - postgres_persistence_check:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personalcrm"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migration:
    image: "personalcrm:${APP_VERSION:?APP_VERSION_required}"
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: postgres
    command: uv run --no-cache --no-sync alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN_required}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_persistence_check:
  caddy_data:
  caddy_config: