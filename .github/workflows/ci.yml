name: CIon:  push:  pull_request:permissions:  contents: readjobs:  checks:    runs-on: ubuntu-latest    steps:      - name: Скачать код репозитория        uses: actions/checkout@v4      - name: Установить uv        uses: astral-sh/setup-uv@v6        with:          version: "0.11.29"      - name: Установить Python        run: uv python install 3.12      - name: Установить зависимости        run: uv sync --locked --python 3.12      - name: Проверить Ruff        run: uv run --no-sync ruff check backend      - name: Проверить типы        run: uv run --no-sync mypy backend/app      - name: Подготовка к интеграционным тестам PostgreSQL и Redis        run:  docker compose -f compose.test.yaml up -d --wait      - name: Запуск тестов        env:          CRM_TEST_SERVICES: '1'        run: uv run --no-sync pytest .