name: CIon:  push:  pull_request:permissions:  contents: readjobs:  checks:    runs-on: ubuntu-latest    steps:      - name: Скачать код репозитория        uses: actions/checkout@v4      - name: Установить uv        uses: astral-sh/setup-uv@v6        with:          version: "0.11.29"      - name: Установить Python        run: uv python install 3.12      - name: Установить зависимости        run: uv sync --locked --python 3.12      - name: Проверить Ruff        run: uv run --no-sync ruff check backend      - name: Проверить типы        run: uv run --no-sync mypy backend/app      - name: Подготовка к интеграционным тестам PostgreSQL и Redis        run:  docker compose -f compose.test.yaml up -d --wait      - name: Запуск тестов        env:          CRM_TEST_SERVICES: '1'          SECRET_KEY: 'ci-only-signing-key-not-for-production'          ALGORITHM: 'HS256'          ACCESS_TOKEN_EXPIRE_MINUTES: '30'          REFRESH_TOKEN_EXPIRE_DAYS: '30'          SUPER_ADMIN: 'admin@example.com'          EMAIL: 'sender@example.com'          PASSWORD: 'ci-placeholder'          EMAIL_HOST: 'localhost'          EMAIL_PORT: '587'          GEMINI_API_KEY: 'ci-placeholder'          GENERAL_TIMEOUT: '30'          MAIN_URL: 'http://testserver'        run: uv run --no-sync pytest .